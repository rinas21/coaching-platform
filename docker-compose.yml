services:
  postgres:
    image: postgres:16-alpine
    container_name: safespace_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - safespace

  image-proxy:
    image: darthsim/imgproxy:latest
    container_name: safespace_image_proxy
    restart: unless-stopped
    environment:
      - IMGPROXY_ENFORCE_WEBP=true
      - IMGPROXY_MAX_SRC_RESOLUTION=50
      - IMGPROXY_ENABLE_WEBP_DETECTION=true
    ports:
      - "8080:8080"
    networks:
      - safespace

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: safespace_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: "8000"
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/safespace_app
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      PAYHERE_MERCHANT_ID: ${PAYHERE_MERCHANT_ID:-}
      PAYHERE_MERCHANT_SECRET: ${PAYHERE_MERCHANT_SECRET:-}
      PAYHERE_SANDBOX: ${PAYHERE_SANDBOX:-true}
      PAYHERE_CURRENCY: ${PAYHERE_CURRENCY:-LKR}
      PAYHERE_COUNTRY: ${PAYHERE_COUNTRY:-LK}
      PAYHERE_NOTIFY_URL: ${PAYHERE_NOTIFY_URL:-}
      CHECKOUT_SHIPPING_CENTS: ${CHECKOUT_SHIPPING_CENTS:-0}
      ORDER_NOTIFY_ADMIN_EMAIL: ${ORDER_NOTIFY_ADMIN_EMAIL:-}
      CONTACT_NOTIFY_EMAIL: ${CONTACT_NOTIFY_EMAIL:-}
    ports:
      - "8000:8000"
    networks:
      - safespace

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: safespace_strapi
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "1337"
      NODE_ENV: production
      DATABASE_CLIENT: postgres
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/safespace_strapi
      APP_KEYS: ${APP_KEYS:?set APP_KEYS in .env}
      API_TOKEN_SALT: ${API_TOKEN_SALT:?set API_TOKEN_SALT in .env}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?set ADMIN_JWT_SECRET in .env}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:?set TRANSFER_TOKEN_SALT in .env}
      JWT_SECRET: ${STRAPI_JWT_SECRET:-${JWT_SECRET:?set STRAPI_JWT_SECRET or JWT_SECRET in .env}}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
    volumes:
      - ./docker-data/strapi/uploads:/app/public/uploads
    ports:
      - "1337:1337"
    networks:
      - safespace

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL:-http://localhost:1337}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_PAYHERE_CURRENCY: ${NEXT_PUBLIC_PAYHERE_CURRENCY:-LKR}
        NEXT_PUBLIC_CHECKOUT_SHIPPING_CENTS: ${NEXT_PUBLIC_CHECKOUT_SHIPPING_CENTS:-0}
        NEXT_PUBLIC_INSTAGRAM_URL: ${NEXT_PUBLIC_INSTAGRAM_URL:-https://instagram.com/thesafespaceglobal}
        NEXT_PUBLIC_INSTAGRAM_EMBED_URL: ${NEXT_PUBLIC_INSTAGRAM_EMBED_URL:-}
    container_name: safespace_frontend
    restart: unless-stopped
    depends_on:
      - backend
      - api
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      STRAPI_URL: http://backend:1337
    ports:
      - "3000:3000"
    networks:
      - safespace

volumes:
  postgres_data:

networks:
  safespace:
    driver: bridge
